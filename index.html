<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d15"><meta name="description" content="OVERDRIVE: WORLD TOUR racing game">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>OVERDRIVE: WORLD TOUR</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
 <canvas id="view"></canvas>
 <div class="topbar"><div class="brand">OVER<span>DRIVE</span><small>WORLD TOUR</small></div><div class="raceinfo"><b id="lap">LAP 1 / 3</b><span id="checkpoint">CHECKPOINT 1 / 8</span></div><div class="speed"><strong id="speed">000</strong><small>KM/H</small></div></div>
 <div class="leftstats"><div class="stat"><small>POSITION</small><b id="position">1<span>ST</span></b></div><div class="stat"><small>BEST LAP</small><b id="best">--:--.---</b></div></div>
 <div class="center-message" id="message">WORLD TOUR <small>READY TO RACE</small></div>
 <div class="bottom"><div class="hint">WASD / ARROWS · SPACE HANDBRAKE · C CAMERA · R RESET</div><button id="camera">CAM: CHASE</button></div>
 <div class="mobile-controls"><div class="steer"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="pedals"><button data-key="brake">BRAKE</button><button data-key="hand">DRIFT</button><button data-key="gas" class="gas">GAS</button></div></div>
 <div id="countdown"></div>
</div>
<script type="module" src="game.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));}</script>
</body></html>
